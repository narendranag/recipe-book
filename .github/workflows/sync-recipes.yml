name: Sync Recipes

on:
  schedule:
    - cron: '0 6 * * 1' # Weekly on Monday at 6am UTC
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  sync-youtube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt httpx

      - name: Fetch YouTube recipes
        run: cd scripts && python ingest_youtube.py
        env:
          YOUTUBE_PLAYLIST_URL: ${{ secrets.YOUTUBE_PLAYLIST_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Rewrite unprocessed recipes
        run: cd scripts && python rewrite_recipes.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Check for changes
        id: changes
        run: |
          git add content/recipes/
          if [ -d "public/images/recipes" ]; then git add public/images/recipes/; fi
          git diff --cached --quiet || echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Commit new recipes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "recipe-bot"
          git config user.email "recipe-bot@users.noreply.github.com"
          git commit -m "chore: sync and rewrite recipes"
          git push
